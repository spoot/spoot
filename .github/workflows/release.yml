name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Analyze & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push version-bump commits and tags

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the script can find git tags from previous releases
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Writes ~/.npmrc with NODE_AUTH_TOKEN interpolation for pnpm publish
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        run: pnpm release
        env:
          CF_AI_GATEWAY_URL: ${{ secrets.CF_AI_GATEWAY_URL }}
          CF_AI_GATEWAY_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Git identity for the version-bump commit
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
