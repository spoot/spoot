name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Analyze & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push version-bump commits and tags
      id-token: write  # OIDC token for npm trusted publisher auth

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the script can find git tags from previous releases
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
          always-auth: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore analysis cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/spoot-release-cache.json
          key: spoot-release-cache-v1-${{ github.sha }}
          restore-keys: |
            spoot-release-cache-v1-

      - name: Release
        run: pnpm release
        env:
          CF_AI_GATEWAY_URL: ${{ secrets.CF_AI_GATEWAY_URL }}
          CF_AI_GATEWAY_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          # Git identity for the version-bump commit
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
